name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PHP_EXTENSIONS: bcmath, curl, gd, intl, mbstring, mysqli, zip, exif, sodium, opcache

jobs:
  checks:
    name: Lint and translations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: none

      - name: Install gettext
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext

      - name: Lint PHP, JavaScript and shell
        run: make lint

      - name: Check translations
        run: make locales-check

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          tools: none

      - name: Run engine tests
        run: make test

  e2e:
    name: E2E (GLPI ${{ matrix.glpi }})
    needs: [checks, unit]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest and latest release of each supported GLPI branch, built into the image of
        # docker/compose.yml (PHP 8.5, MariaDB 11.4), as in the dev container.
        glpi: ['11.0.0', '11.0.x', '12.0.0', '12.0.x']
    env:
      GLPI_VERSION: ${{ matrix.glpi }}
      # Short executions of the background task, so that the e2e scenario also
      # checks that a job resumes over several runs.
      ENTITYSYNC_RUN_TIME_BUDGET: '2'
    steps:
      - uses: actions/checkout@v7

      # PHP client of the scenario (HTTP and database checks); GLPI runs in Docker.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, mysqli
          tools: none

      - name: Install gettext
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext

      - name: Start GLPI and install the plugin
        run: make glpi-up

      - name: Run the end-to-end scenario
        run: make e2e

      - name: Collect GLPI logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp -r docker/log/. "$RUNNER_TEMP/logs/" || true
          docker compose -f docker/compose.yml logs --no-color > "$RUNNER_TEMP/logs/compose.log" 2>&1 || true

      - name: Upload GLPI logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: glpi-logs-${{ matrix.glpi }}
          path: ${{ runner.temp }}/logs
          retention-days: 7

  package:
    name: Package
    needs: [e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the last commit date makes the archive reproducible

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: Install gettext
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext

      - name: Build the archive
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tools/build-package.sh --tag "$GITHUB_REF_NAME"
          else
            tools/build-package.sh
          fi

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: entitysync-package
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: Install gettext
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext

      # Rebuilt from the tag: the build is reproducible, so the archive is identical
      # to the one checked by the package job.
      - name: Build the archive
        run: tools/build-package.sh --tag "$GITHUB_REF_NAME"

      - name: Extract the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## ${version}" '$0 == v {found = 1; next} found && /^## / {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "Entity Sync ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
