; PHP settings for the GLPI development instance.
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 300
session.cookie_httponly = On

; Xdebug is installed by the base image; start it on demand with the
; XDEBUG_TRIGGER cookie/parameter (e.g. a browser extension).
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_port = 9003
